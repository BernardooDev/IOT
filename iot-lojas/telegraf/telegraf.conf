[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = false

# ---------- INPUT: MQTT ----------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["varejo/+/camara-fria/temperatura"]
  qos = 0
  client_id = "telegraf-lojas"
  data_format = "json"
  name_override = "temperatura"
  # payload: {"loja":"loja01","temperatura":5.2}
  tag_keys = ["loja"]

# ---------- OUTPUT: InfluxDB 2.x ----------
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

# ---------- usado apenas pelo healthcheck do Docker ----------
[[outputs.health]]
  service_address = "http://:8080"
